<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Azure Translator Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h1 class="title">🌍 Azure Translator</h1>

  <div class="config">
    <input type="text" id="key" placeholder="Azure API Key">
    <input type="text" id="region" placeholder="Azure Region (e.g. eastus)">
  </div>

  <textarea id="inputText" placeholder="Enter text..."></textarea>

  <div class="controls">
    <select id="targetLang">
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="hi">Hindi</option>
      <option value="zh-Hans">Chinese</option>
    </select>

    <button onclick="translateText()">Translate</button>
  </div>

  <div id="outputText" class="output"></div>
</div>

<script src="script.js"></script>
</body>
</html>
